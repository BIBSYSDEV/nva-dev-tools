# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Check
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Fail when uv.lock does not match pyproject.toml instead of quietly resolving again
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Also proves the shared toolchain installs on a fresh machine
      - name: Install mise and the shared tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          cache: true

      - name: Show resolved tools
        run: mise ls

      # For `claude plugin validate` in the check task, which needs no login
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.322

      - name: Lint
        run: mise run check

      - name: Test
        run: mise run test

      - name: Every shared task loads and has a valid usage spec
        run: |
          mise tasks ls --json | jq -r '.[].name' | while read -r task; do
            echo "::group::$task"
            mise run "$task" --help
            echo "::endgroup::"
          done
