[project]
name = "nva-dev-tools"
version = "0.1.0"
description = "Local development workflow CLI for NVA (git worktrees, repo hygiene)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "rich>=15.0.0",
]

[project.scripts]
nva-dev = "nva_dev_tools.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# On top of Ruff's defaults, which leave out most of these families' rules
extend-select = ["E", "F", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Every test isolates itself in its own tmp_path, and the git subprocesses dominate, so run them in parallel
addopts = "-n auto"
