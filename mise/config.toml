# Shared tools for NVA development. Setup: see README.md in this folder.

[tools]
# Runtimes
java = "corretto-21"
node = "24"
python = "3.15.2"
uv = "0.13.5"

# CLIs used by the shared tasks (bump with `mise run bump` in this repo)
aws-cli = "2.36.50"
cfn-lint = "1.58.0"
# The version pins the tool; uvx_args makes uv pick only dependencies released at least seven days ago.
"pypi:check-jsonschema" = { version = "0.39.0", uvx_args = "--exclude-newer 7d" }
gh = "2.103.0"
jactionlint = "2.6.0"
jq = "1.8.2"
shellcheck = "0.11.0"
spectral = "6.17.0"
yq = "4.54.1"
